name: Sync scanner from relay evidence

on:
  push:
    branches: [main]
    paths:
      - wisp-relays/eagler-compat.json
      - wisp-relays/scanner-relays-454.json
      - wisp-scanner/scanner.template.html
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-scanner
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Re-apply relay evidence
        run: node wisp-relays/apply-eagler-compat.mjs
      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wisp-relays/scanner-relays-454.json wisp-scanner/index.html
          if git diff --cached --quiet; then
            echo "already current"
            exit 0
          fi
          git commit -m "Regenerate scanner from Eaglercraft evidence"
          git push
